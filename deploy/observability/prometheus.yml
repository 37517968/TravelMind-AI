global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: agent-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["agent-api:9090", "agent-worker:9090", "knowledge-worker:9090"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
