{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "travelmind-ai.fullname" . }}-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "travelmind-ai.fullname" . }}-api}
  minReplicas: {{ .Values.autoscaling.api.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.api.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.api.targetCPUUtilizationPercentage }}}
---
{{- if not .Values.keda.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "travelmind-ai.fullname" . }}-agent-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "travelmind-ai.fullname" . }}-agent-worker}
  minReplicas: {{ .Values.autoscaling.agentWorker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.agentWorker.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 600}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.agentWorker.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
