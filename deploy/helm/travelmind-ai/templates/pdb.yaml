apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "travelmind-ai.fullname" . }}-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "travelmind-ai.fullname" . }}-agent-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agent-worker}
