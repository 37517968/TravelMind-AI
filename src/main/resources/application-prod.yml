spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:travelmind_ai}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:agent}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${AGENT_WORKER_PREFETCH:1}
        concurrency: ${AGENT_WORKER_CONCURRENCY:1}
        max-concurrency: ${AGENT_WORKER_MAX_CONCURRENCY:4}
        observation-enabled: true
        shutdown-timeout: 60s
    template:
      observation-enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      # 不指定则 spring-ai-alibaba 默认用 text-embedding-v1，这里显式锁定 v3（默认 1024 维）
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    # 当前 STDIO MCP 配置包含 Windows 命令，生产环境暂时关闭。
    mcp:
      client:
        enabled: false

search-api:
  api-key: ${SEARCH_API_KEY:}

travel:
  tools:
    # 生产无条件禁用 Shell/FileSystem/下载类高风险工具。
    high-risk-enabled: false
    executor:
      core-size: ${TOOL_EXECUTOR_CORE_SIZE:8}
      max-size: ${TOOL_EXECUTOR_MAX_SIZE:16}
      queue-capacity: ${TOOL_EXECUTOR_QUEUE_CAPACITY:100}
  governance:
    tool-max-concurrency: ${TOOL_MAX_CONCURRENCY:16}
    model-max-concurrency: ${MODEL_MAX_CONCURRENCY:4}
    user-tool-qps: ${USER_TOOL_QPS:5}
  mcp:
    remote:
      enabled: ${MCP_REMOTE_ENABLED:false}
  knowledge:
    vectorstore:
      type: pgvector
    pgvector:
      jdbc-url: ${PGVECTOR_JDBC_URL:jdbc:postgresql://pgvector:5432/travel_knowledge}
      username: ${PGVECTOR_USERNAME:travel}
      password: ${PGVECTOR_PASSWORD}

logging:
  level:
    org.springframework.ai: INFO
    com.travelmind.aiagent.mapper: INFO

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}

app:
  runtime:
    role: ${APP_RUNTIME_ROLE:api}
    agent-worker-enabled: ${APP_AGENT_WORKER_ENABLED:false}
    knowledge-worker-enabled: ${APP_KNOWLEDGE_WORKER_ENABLED:false}
